<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102c30">
  <title>Lane Split Rush</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./src/styles.css">
  <script src="https://www.youtube.com/game_api/v1"></script>
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <main class="game-shell">
    <section class="title-screen" aria-labelledby="game-title">
      <label class="sound-toggle" title="Sound effects and engine">
        <input id="sound-toggle" type="checkbox" checked>
        <span aria-hidden="true">♪</span>
        <span class="sr-only">Sound effects and engine</span>
      </label>
      <div class="high-score"><span data-i18n="ui.highScore">HighScore</span><strong id="high-score">0</strong></div>
      <h1 id="game-title"><span data-i18n="title.lane">LANE</span> <span data-i18n="title.split">SPLIT</span><span class="rush" data-i18n="title.rush">RUSH</span></h1>
      <div class="machine-selector" id="machine-selector" aria-label="Machine selection">
        <button class="machine-arrow" id="machine-prev" type="button" aria-label="Previous machine">‹</button>
        <div class="machine-card" aria-live="polite">
          <div class="machine-preview" aria-hidden="true">
            <svg viewBox="0 0 160 96" role="presentation">
              <g class="preview-bike"><circle cx="42" cy="71" r="18"></circle><circle cx="119" cy="71" r="18"></circle><path d="M42 65h25l17-28h25l12 28h-12l-10-18H88L76 69H55z"></path><path d="M72 35h29l8 12H82zM65 31h24v7H65z"></path></g>
              <g class="preview-scooter"><circle cx="43" cy="72" r="16"></circle><circle cx="119" cy="72" r="16"></circle><path d="M42 67h31l12-13h18l14 13-8 8H73l-12-9z"></path><path d="M76 59V43h13l6-18h9l-4 30zM91 24h25v6H98zM61 48h24v9H61z"></path></g>
              <g class="preview-supersport"><circle cx="39" cy="72" r="18"></circle><circle cx="122" cy="72" r="18"></circle><path d="M38 65h24l15-25h32l16 25-9 10H59z"></path><path d="M66 48l17-20h30l8 14-19 8zM79 26h25l11 7H72z"></path></g>
              <g class="preview-supersport"><circle cx="39" cy="72" r="18"></circle><circle cx="122" cy="72" r="18"></circle><path d="M38 65h24l15-25h32l16 25-9 10H59z"></path><path d="M66 48l17-20h30l8 14-19 8zM79 26h25l11 7H72z"></path></g>
            </svg>
          </div>
          <strong class="machine-name" id="machine-name">STREET</strong>
          <span class="machine-status" id="machine-status">SELECTED</span>
          <small class="machine-index" id="machine-index">1 / 5</small>
        </div>
        <button class="machine-arrow" id="machine-next" type="button" aria-label="Next machine">›</button>
      </div>
      <div class="actions">
        <button class="play-button" id="play" data-i18n="ui.play">Play</button>
      </div>
    </section>
    <section id="game-stage" aria-label="Game" hidden>
      <canvas id="game-canvas" aria-label="Swipe left and right to steer" tabindex="0"></canvas>
      <div class="hud" id="hud">
        <div class="health-block"><span data-i18n="hud.health"></span><strong id="health"></strong></div>
        <div class="score-block"><span data-i18n="hud.score"></span><strong id="score">0</strong><small id="hud-best"></small></div>
        <div class="combo-block"><span data-i18n="hud.combo"></span><strong id="combo">0</strong><small id="multiplier">×1.0</small><div class="combo-track"><i id="combo-timer"></i></div></div>
        <button id="pause-button" class="pause-button" data-i18n="ui.pause"></button>
      </div>
      <div id="turbo-label"></div>
      <div id="toast" role="status" aria-live="polite"></div>
      <div class="bottom-hud"><div class="speed-readout"><strong id="speed">0</strong><span>km/h</span><small id="distance">0 m</small></div></div>
      <div id="game-overlay" hidden></div>
      <div id="impact" aria-hidden="true"></div>
    </section>
  </main>
  <dialog id="modal" aria-labelledby="modal-title"><div class="modal-top"><span class="eyebrow" id="modal-kicker"></span><button id="close-modal" class="icon-button" aria-label="Close">×</button></div><h2 id="modal-title"></h2><div id="modal-content"></div><button class="play-button modal-action" id="modal-action"></button></dialog>
  <p class="load-error" id="load-error" hidden>Unable to load. Start the local server, then refresh this page.</p>
</body>
</html>
